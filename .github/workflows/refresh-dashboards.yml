name: Refresh profile dashboards

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 07:47 IST
  workflow_dispatch:
  push:
    paths:
      - "data/projects.json"
      - "scripts/build_profile.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild SVGs from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/github_cache.json
          git diff --cached --quiet || git commit -m "chore: refresh profile dashboards"
          git push
